  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a28;
      --bg-card-hover: #222236;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --accent-glow: rgba(108, 92, 231, 0.3);
      --text-primary: #f0f0f5;
      --text-secondary: #8888a0;
      --text-muted: #55556a;
      --success: #00b894;
      --danger: #e74c3c;
      --border: rgba(255, 255, 255, 0.06);
      --border-light: rgba(255, 255, 255, 0.1);
      --glass: rgba(255, 255, 255, 0.03);
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    /* Header */
    header {
      background: linear-gradient(180deg, rgba(108, 92, 231, 0.08) 0%, transparent 100%);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .logo { display: flex; align-items: center; gap: 10px; }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), #e74c3c);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .logo-text {
      font-size: 20px; font-weight: 700; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .header-info { display: flex; align-items: center; gap: 16px; }

    .live-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid rgba(231, 76, 60, 0.3);
      padding: 5px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; color: #e74c3c;
    }

    .live-dot {
      width: 7px; height: 7px; background: #e74c3c;
      border-radius: 50%; animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .channel-count { font-size: 12px; color: var(--text-secondary); font-weight: 500; }

    /* Main Layout */
    .main-container { display: flex; flex: 1; overflow: hidden; }

    /* Player */
    .player-section { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #000; }

    .player-wrapper {
      flex: 1; position: relative; background: #000;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }

    .video-js { width: 100% !important; height: 100% !important; }

    .video-js .vjs-big-play-button {
      background: var(--accent) !important; border: none !important;
      border-radius: 50% !important; width: 70px !important; height: 70px !important;
      line-height: 70px !important; font-size: 28px !important;
      box-shadow: 0 0 40px var(--accent-glow); transition: var(--transition);
    }
    .video-js .vjs-big-play-button:hover { transform: scale(1.1); box-shadow: 0 0 60px var(--accent-glow); }

    .video-js .vjs-control-bar {
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 100%) !important;
      height: 50px !important; padding: 0 8px;
    }
    .video-js .vjs-play-progress { background: var(--accent) !important; }
    .video-js .vjs-slider { background: rgba(255,255,255,0.15) !important; }

    /* Now Playing */
    .now-playing {
      background: var(--bg-secondary); border-top: 1px solid var(--border);
      padding: 12px 24px; display: flex; align-items: center; gap: 14px;
    }

    .np-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), #e74c3c);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .np-details { flex: 1; min-width: 0; }

    .np-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--accent-light); font-weight: 600; margin-bottom: 2px;
    }

    .np-channel-name {
      font-size: 15px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .np-category { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }

    .np-status {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; flex-shrink: 0;
    }

    .np-status.live {
      background: rgba(0, 184, 148, 0.12); color: var(--success);
      border: 1px solid rgba(0, 184, 148, 0.25);
    }

    .np-status .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success); animation: pulse 1.5s ease-in-out infinite;
    }

    /* Sidebar */
    .sidebar {
      width: 360px; background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
    }

    .sidebar-header { padding: 18px 20px 0; }

    .sidebar-title {
      font-size: 16px; font-weight: 700; margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .sidebar-title .material-symbols-outlined { font-size: 20px; color: var(--accent-light); }

    /* Search */
    .search-box { position: relative; margin-bottom: 14px; }

    .search-box input {
      width: 100%; padding: 10px 14px 10px 40px;
      background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-size: 13px; font-family: inherit; outline: none; transition: var(--transition);
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    .search-box .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      font-size: 18px; color: var(--text-muted); pointer-events: none;
    }

    /* Category Tabs */
    .category-tabs {
      display: flex; gap: 6px; padding-bottom: 14px;
      overflow-x: auto; scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }

    .cat-tab {
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: var(--transition);
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-secondary); user-select: none;
    }
    .cat-tab:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .cat-tab.active {
      background: var(--accent); border-color: var(--accent); color: #fff;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    /* Channel List */
    .channel-list { flex: 1; overflow-y: auto; padding: 0 10px 10px; }

    .channel-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: var(--radius-sm);
      cursor: pointer; transition: var(--transition);
      margin-bottom: 4px; position: relative; overflow: hidden;
      animation: fadeInUp 0.3s ease both;
    }

    .channel-item::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      opacity: 0; background: linear-gradient(135deg, var(--accent-glow), transparent);
      transition: var(--transition);
    }
    .channel-item:hover { background: var(--bg-card-hover); }
    .channel-item:hover::before { opacity: 1; }

    .channel-item.active {
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(108, 92, 231, 0.05));
      border: 1px solid rgba(108, 92, 231, 0.3);
    }
    .channel-item.active .ch-name { color: var(--accent-light); font-weight: 600; }
    .channel-item.active .ch-number { color: var(--accent-light); }

    .ch-number {
      width: 26px; height: 26px; border-radius: 6px; background: var(--bg-card);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      flex-shrink: 0; position: relative; z-index: 1;
    }

    .ch-icon {
      width: 38px; height: 38px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0; position: relative; z-index: 1;
      font-weight: 700; text-transform: uppercase; letter-spacing: -0.5px; color: #fff;
    }

    .ch-info { flex: 1; min-width: 0; position: relative; z-index: 1; }

    .ch-name {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
    }
    .ch-category { font-size: 11px; color: var(--text-muted); }

    .ch-live-indicator {
      width: 8px; height: 8px; border-radius: 50%; background: var(--success);
      flex-shrink: 0; position: relative; z-index: 1;
      opacity: 0; transition: var(--transition);
    }
    .channel-item.active .ch-live-indicator { opacity: 1; animation: pulse 1.5s ease-in-out infinite; }

    /* Empty state */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-state .material-symbols-outlined { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
    .empty-state p { font-size: 13px; }

    /* Loading overlay */
    .loading-overlay {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.7);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .loading-overlay.visible { opacity: 1; pointer-events: auto; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 14px; font-size: 13px; color: var(--text-secondary); font-weight: 500; }

    /* Responsive */
    @media (max-width: 900px) { .sidebar { width: 300px; } }
    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); max-height: 45vh; }
      .player-section { flex: none; }
      .player-wrapper { aspect-ratio: 16/9; }
      header { padding: 10px 16px; }
      .now-playing { padding: 10px 16px; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  const iconColors = [
    ['#6c5ce7','#a29bfe'], ['#e74c3c','#fd79a8'], ['#00b894','#55efc4'],
    ['#0984e3','#74b9ff'], ['#fdcb6e','#f39c12'], ['#e17055','#fab1a0'],
    ['#00cec9','#81ecec'], ['#636e72','#b2bec3']
  ];

  function getIconColor(i) { return iconColors[i % iconColors.length]; }
  function getInitials(name) {
    const w = name.trim().split(/\s+/);
    return w.length === 1 ? w[0].substring(0, 2) : w[0][0] + w[1][0];
  }

  const player = videojs('main-player', {
    fluid: false, fill: true, responsive: true,
    html5: { vhs: { overrideNative: true }, nativeAudioTracks: false, nativeVideoTracks: false }
  });

  const loadingOverlay = document.getElementById('loadingOverlay');
  const npName = document.getElementById('npName');
  const npCategory = document.getElementById('npCategory');
  const npStatus = document.getElementById('npStatus');
  const channelListEl = document.getElementById('channelList');
  const searchInput = document.getElementById('searchInput');
  const categoryTabsEl = document.getElementById('categoryTabs');
  const channelCountEl = document.getElementById('channelCount');

  let activeElement = null;
  let activeFilter = 'All';

  player.on('waiting', () => loadingOverlay.classList.add('visible'));
  player.on('playing', () => loadingOverlay.classList.remove('visible'));
  player.on('error', () => loadingOverlay.classList.remove('visible'));

  function loadChannel(channel, element) {
    loadingOverlay.classList.add('visible');
    player.src({ src: channel.url, type: 'application/x-mpegURL' });
    player.play().catch(() => loadingOverlay.classList.remove('visible'));
    npName.textContent = channel.name;
    npCategory.textContent = channel.category;
    npStatus.style.display = 'flex';
    if (activeElement) activeElement.classList.remove('active');
    element.classList.add('active');
    activeElement = element;
  }

  const categories = ['All', ...new Set(channels.map(c => c.category))];
  categories.forEach(cat => {
    const tab = document.createElement('div');
    tab.className = 'cat-tab' + (cat === 'All' ? ' active' : '');
    tab.textContent = cat;
    tab.onclick = () => {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeFilter = cat;
      renderChannels();
    };
    categoryTabsEl.appendChild(tab);
  });

  searchInput.addEventListener('input', () => renderChannels());

  function renderChannels() {
    const query = searchInput.value.toLowerCase().trim();
    channelListEl.innerHTML = '';
    const filtered = channels.filter(ch => {
      const matchesSearch = ch.name.toLowerCase().includes(query);
      const matchesCat = activeFilter === 'All' || ch.category === activeFilter;
      return matchesSearch && matchesCat;
    });

    if (filtered.length === 0) {
      channelListEl.innerHTML = '<div class="empty-state"><span class="material-symbols-outlined">search_off</span><p>No channels found</p></div>';
      return;
    }

    filtered.forEach((channel, idx) => {
      const globalIdx = channels.indexOf(channel);
      const colors = getIconColor(globalIdx);
      const div = document.createElement('div');
      div.className = 'channel-item';
      div.style.animationDelay = idx * 0.03 + 's';
      if (activeElement && activeElement.dataset.channelName === channel.name) {
        div.classList.add('active');
        activeElement = div;
      }
      div.dataset.channelName = channel.name;
      div.innerHTML = '<div class="ch-number">' + (globalIdx + 1) + '</div>'
        + '<div class="ch-icon" style="background:linear-gradient(135deg,' + colors[0] + ',' + colors[1] + ')">' + getInitials(channel.name) + '</div>'
        + '<div class="ch-info"><div class="ch-name">' + channel.name + '</div><div class="ch-category">' + channel.category + '</div></div>'
        + '<div class="ch-live-indicator"></div>';
      div.onclick = () => loadChannel(channel, div);
      channelListEl.appendChild(div);
    });
  }

  channelCountEl.textContent = channels.length + ' Channels';
  renderChannels();
  const firstItem = channelListEl.querySelector('.channel-item');
  if (firstItem) loadChannel(channels[0], firstItem);
</script>
